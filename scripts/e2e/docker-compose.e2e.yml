name: detent-e2e

x-jms: &jms
  image: jumpserver/core:v4.10.20-ce
  environment:
    LC_ALL: C.UTF-8
    SECRET_KEY: detent-e2e-jumpserver-test-only-secret-key-2026
    BOOTSTRAP_TOKEN: detent-e2e-jumpserver-bootstrap
    DOMAINS: "127.0.0.1:${E2E_JUMPSERVER_PORT:-18088},localhost:${E2E_JUMPSERVER_PORT:-18088},jms-core:8080"
    DB_ENGINE: postgresql
    DB_HOST: jms-postgres
    DB_PORT: "5432"
    DB_NAME: jumpserver
    DB_USER: jumpserver
    DB_PASSWORD: detent-e2e-jms-pg
    REDIS_HOST: jms-redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: detent-e2e-jms-redis
    SERVER_SIZE: small
    CELERY_WORKER_COUNT: "2"
    SECURITY_COMMAND_EXECUTION: "true"
    ANSIBLE_DOCKER_ENABLED: "false"
  volumes:
    - jms-data:/opt/jumpserver/data

services:
  gitlab:
    image: gitlab/gitlab-ce:18.3.0-ce.0
    ports:
      - "127.0.0.1:${E2E_GITLAB_PORT:-18080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url "http://127.0.0.1:${E2E_GITLAB_PORT:-18080}"
        nginx['listen_port'] = 80
        nginx['worker_processes'] = 1
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 4
        postgresql['shared_buffers'] = '128MB'
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        gitlab_pages['enable'] = false
        registry['enable'] = false
        mattermost['enable'] = false
        gitlab_rails['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }
        gitlab_rails['initial_root_password'] = "K9#vQ4!mZ7@xR2$$pW5"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

  mysql:
    image: mysql:8.0
    command: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF", "--max-connections=64"]
    ports:
      - "127.0.0.1:${E2E_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: detent
      MYSQL_USER: detent
      MYSQL_PASSWORD: detent-e2e-mysql
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql

  jms-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jumpserver
      POSTGRES_USER: jumpserver
      POSTGRES_PASSWORD: detent-e2e-jms-pg
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "jumpserver", "-d", "jumpserver"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - jms-pg-data:/var/lib/postgresql/data

  jms-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "detent-e2e-jms-redis"]
    environment:
      REDISCLI_AUTH: detent-e2e-jms-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  jms-core:
    <<: *jms
    command: ["start", "web"]
    ports:
      - "127.0.0.1:${E2E_JUMPSERVER_PORT:-18088}:8080"
    depends_on:
      jms-postgres:
        condition: service_healthy
      jms-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request; assert json.load(urllib.request.urlopen('http://jms-core:8080/api/health/', timeout=4))['status']"
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 36

  jms-celery:
    <<: *jms
    # Bubblewrap binds /lib64 even on arm64, where the image omits it.
    entrypoint: ["/bin/sh", "-c", 'mkdir -p /lib64 && exec ./entrypoint.sh "$@"', "--"]
    command: ["start", "task"]
    # The native playbook runner uses bubblewrap mount namespaces and pivot_root.
    cap_add: [SYS_ADMIN]
    security_opt: ["apparmor:unconfined", "seccomp:unconfined"]
    depends_on:
      jms-core:
        condition: service_healthy
      target-node-01:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/opt/jumpserver/utils/check_celery.sh"]
      interval: 5s
      timeout: 4s
      retries: 24

  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    privileged: true
    hostname: k3s
    command: ["server", "--disable=traefik,servicelb,metrics-server,local-storage,coredns", "--tls-san=k3s", "--write-kubeconfig=/output/kubeconfig.yaml", "--write-kubeconfig-mode=0644"]
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-kubeconfig:/output
    healthcheck:
      test: ["CMD", "kubectl", "--kubeconfig=/output/kubeconfig.yaml", "wait", "--for=condition=Ready", "node/k3s", "--timeout=2s"]
      interval: 3s
      timeout: 5s
      retries: 40

  target-node-01:
    build: ./target-node
    hostname: target-node-01
    container_name: detent-e2e-target-node-01
    init: true
    depends_on:
      k3s:
        condition: service_healthy
    volumes:
      - k3s-kubeconfig:/k3s-kubeconfig:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import socket, subprocess; assert socket.create_connection(('localhost', 22), 2).recv(4) == b'SSH-'; assert socket.create_connection(('localhost', 9092), 2).recv(10).startswith(b'demo-kafka'); assert subprocess.check_output(['su', '-', 'ops', '-c', 'helm version --short >/dev/null && kubectl get --raw=/readyz']).strip() == b'ok'"
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  default:
    name: detent-e2e-net
    driver: bridge

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  mysql-data:
  jms-pg-data:
  jms-data:
  k3s-data:
  k3s-kubeconfig:
